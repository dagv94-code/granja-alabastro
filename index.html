  <title>Agropecuaria Alabastro · Gestión Porcina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2309090b'/%3E%3Ccircle cx='50' cy='54' r='30' fill='%23ffffff'/%3E%3Cpath d='M24 34 L16 16 L36 26 Z' fill='%23ffffff'/%3E%3Cpath d='M76 34 L84 16 L64 26 Z' fill='%23ffffff'/%3E%3Cellipse cx='50' cy='61' rx='13' ry='9' fill='%2309090b'/%3E%3Ccircle cx='45' cy='61' r='2.5' fill='%23ffffff'/%3E%3Ccircle cx='55' cy='61' r='2.5' fill='%23ffffff'/%3E%3Ccircle cx='38' cy='46' r='3.5' fill='%2309090b'/%3E%3Ccircle cx='62' cy='46' r='3.5' fill='%2309090b'/%3E%3C/svg%3E" />

<body class="bg-zinc-100 text-zinc-950 antialiased">
  <div id="root"></div>

  <!-- Conexión Firebase Firestore en tiempo real + persistencia offline -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getFirestore, doc, setDoc, onSnapshot, initializeFirestore, persistentLocalCache, persistentMultipleTabManager
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIhap9scTtQS1uMx9-xHpiN-D2x4A5kp4",
      authDomain: "granja-alabastro.firebaseapp.com",
      projectId: "granja-alabastro",
      storageBucket: "granja-alabastro.firebasestorage.app",
      messagingSenderId: "927708503319",
      appId: "1:927708503319:web:f85b224d18c36236ff2b52"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
      db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
      });
    } catch (e) {
      db = getFirestore(app);
    }

    window.AlabastroDB = {
      docRef: doc(db, "granja_alabastro", "estado_operativo_v1"),
      subscribe: (onData, onError) => {
        return onSnapshot(doc(db, "granja_alabastro", "estado_operativo_v1"), { includeMetadataChanges: true }, (snap) => {
          onData(snap.exists() ? snap.data() : null, snap.metadata.fromCache, snap.metadata.hasPendingWrites);
        }, onError);
      },
      save: async (payload) => {
        await setDoc(doc(db, "granja_alabastro", "estado_operativo_v1"), {
          ...payload,
          ultima_actualizacion: new Date().toISOString()
        });
      }
    };
    window.dispatchEvent(new Event("alabastro-db-ready"));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- UTILIDADES DE FECHA (America/Caracas - dd-mm-aaaa) ---
    const hoyISO = () => {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split("T")[0];
    };

    const sumarDias = (iso, dias) => {
      if (!iso) return "";
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + Number(dias));
      return dt.toISOString().split("T")[0];
    };

    const diffDias = (isoOrigen, isoDestino) => {
      if (!isoOrigen || !isoDestino) return 0;
      const [y1, m1, d1] = isoOrigen.split("-").map(Number);
      const [y2, m2, d2] = isoDestino.split("-").map(Number);
      const t1 = Date.UTC(y1, m1 - 1, d1);
      const t2 = Date.UTC(y2, m2 - 1, d2);
      return Math.round((t2 - t1) / 86400000);
    };

    const fmtFecha = (iso) => {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-");
      return `${d}-${m}-${y}`;
    };

    // --- CONFIGURACIÓN E INFRAESTRUCTURA OFICIAL ---
    const CONFIG_DEFAULT = {
      ciclo_celo: 21,
      verif_min: 18,
      verif_max: 24,
      desp_gestacion: 100,
      pase_maternidad: 107,
      parto_probable: 114,
      destete_corto: 21,
      destete_largo: 30,
      dia_descolmillado: 2,
      dia_cola_hierro1: 3,
      dia_castracion: 7,
      dia_hierro2: 12,
      desp1_post_destete: 5,
      desp2_vida: 60,
      desp3_vida: 105,
      vitb_ceba_dia: 80,
      dias_sacrificio_ceba: 150,
      peso_objetivo_kg: 105,
      dias_aviso_previo: 1
    };

    const JAULAS_DEFAULT = [
      ...Array.from({ length: 8 }, (_, i) => ({ id: `G-${i + 1}`, area: "Gestación", numero: i + 1, capacidad: 1, estado: "activa" })),
      ...Array.from({ length: 2 }, (_, i) => ({ id: `M-${i + 1}`, area: "Maternidad", numero: i + 1, capacidad: 1, estado: "activa" })),
      ...Array.from({ length: 2 }, (_, i) => ({ id: `PC-${i + 1}`, area: "Pre-ceba", numero: i + 1, capacidad: 20, estado: "activa" })),
      ...Array.from({ length: 4 }, (_, i) => ({ id: `E-${i + 1}`, area: "Engorde", numero: i + 1, capacidad: 20, estado: "activa" })),
      { id: "V-1", area: "Verraco / Celador", numero: 1, capacidad: 1, estado: "activa" }
    ];

    // --- ARRANQUE REAL DE GRANJA ALABASTRO ---
    // - 4 animales para sacrificio esta semana (3 machos, 1 hembra): marcados como S/I (sin numerar).
    // - 7 madres en desarrollo: numeradas del 2 al 8 (Madre 2 a Madre 8 / M-002 a M-008).
    // - Numeración correlativa con arete (#1 en adelante): inicia solo con los lechones que nazcan en la granja.
    const generarArranqueReal = (configActual = CONFIG_DEFAULT) => {
      const fechaCamadaPrevia = "2026-05-25";
      const cerdosSacrificioSemana = [
        { id: "SI-SAC-M1", etiqueta_visual: "Macho · S/I", arete: "", madre_id: "Madre 1", sexo: "M", fecha_nacimiento: fechaCamadaPrevia, corral: "E-1", estado: "engorde", peso_kg: 106, prioridad_sacrificio_semana: true, en_retiro_hasta: "" },
        { id: "SI-SAC-M2", etiqueta_visual: "Macho · S/I", arete: "", madre_id: "Madre 1", sexo: "M", fecha_nacimiento: fechaCamadaPrevia, corral: "E-1", estado: "engorde", peso_kg: 104, prioridad_sacrificio_semana: true, en_retiro_hasta: "" },
        { id: "SI-SAC-M3", etiqueta_visual: "Macho · S/I", arete: "", madre_id: "Madre 1", sexo: "M", fecha_nacimiento: fechaCamadaPrevia, corral: "E-1", estado: "engorde", peso_kg: 105, prioridad_sacrificio_semana: true, en_retiro_hasta: "" },
        { id: "SI-SAC-H1", etiqueta_visual: "Hembra · S/I", arete: "", madre_id: "Madre 1", sexo: "H", fecha_nacimiento: fechaCamadaPrevia, corral: "E-1", estado: "engorde", peso_kg: 102, prioridad_sacrificio_semana: true, en_retiro_hasta: "" }
      ];

      const hembrasReemplazo = Array.from({ length: 7 }, (_, i) => ({
        id: `SI-REEMP-H${i + 1}`,
        etiqueta_visual: `Hembra Reemplazo · S/I`,
        arete: "",
        madre_id: "Madre 1",
        sexo: "H",
        fecha_nacimiento: fechaCamadaPrevia,
        corral: "E-2",
        estado: "reemplazo_reproductora",
        peso_kg: 96,
        en_retiro_hasta: ""
      }));

      return {
        config: configActual,
        jaulas: JAULAS_DEFAULT,
        verraco: {
          id: "V-001",
          nombre: "Celador / Verraco Principal",
          raza: "Pietrain",
          jaula: "V-1",
          estado: "Activo",
          servicios_realizados: 1,
          notas: "Detección diaria de celo en Madres 2 a 8."
        },
        madres: [
          {
            id: "M-001",
            numero_madre: 1,
            nombre_corto: "Madre 1",
            arete: "1",
            raza: "Landrace x Large White",
            jaula: "G-1",
            estado: "gestante",
            fecha_celo: "2026-09-03",
            fecha_servicio: "2026-09-03",
            tipo_servicio: "Monta Natural",
            verificacion_21d: "confirmada",
            desp_100_hecha: false,
            meloxicam_parto_hecho: false,
            partos: 3,
            nacidos_vivos_total: 12,
            repeticiones: 0,
            notas_origen: "Comprada preñada. 3er parto el 25-05-2026 (12 lechones: 8H, 4M; 1 macho murió a los 3m -> 11 vivos: 7H reproductoras + 4 S/I para sacrificio). Monta registrada el 03-09-2026; aún no desparasitada para día 100."
          },
          ...Array.from({ length: 7 }, (_, idx) => {
            const num = idx + 2; // Madres 2 a 8
            return {
              id: `M-00${num}`,
              numero_madre: num,
              nombre_corto: `Madre ${num}`,
              arete: String(num),
              raza: "Landrace x Large White",
              jaula: `G-${num}`,
              estado: "desarrollo",
              partos: 0,
              nacidos_vivos_total: 0,
              repeticiones: 0,
              notas_origen: `Madre ${num} en desarrollo, sin primer celo aún.`
            };
          })
        ],
        cerdos: [...cerdosSacrificioSemana, ...hembrasReemplazo],
        siguiente_cerdo_id: 1,
        casos_enfermedad: [],
        bajas_sacrificios: [
          {
            fecha: "2026-08-25",
            tipo: "Baja histórica (3 meses)",
            id_animal: "HIST-M1",
            etiqueta_visual: "Macho previo · S/I",
            arete: "",
            motivo: "Muerte a los 3 meses por descuido (de 4 machos del parto 25-05-2026 quedaron 3)"
          }
        ],
        auditoria: [
          { fecha: new Date().toLocaleString("es-VE"), detalle: "Arranque real cargado: 4 cerdos para sacrificio esta semana marcados como S/I, Madres 2 a 8 en desarrollo y Madre 1 gestante (03-09-2026)." }
        ]
      };
    };

    const LogoAlabastro = ({ className = "w-10 h-10" }) => (
      <svg viewBox="0 0 100 100" className={className}>
        <rect width="100" height="100" rx="22" fill="#09090b" />
        <circle cx="50" cy="54" r="30" fill="#ffffff" />
        <path d="M24 34 L16 16 L36 26 Z" fill="#ffffff" />
        <path d="M76 34 L84 16 L64 26 Z" fill="#ffffff" />
        <ellipse cx="50" cy="61" rx="13" ry="9" fill="#09090b" />
        <circle cx="45" cy="61" r="2.5" fill="#ffffff" />
        <circle cx="55" cy="61" r="2.5" fill="#ffffff" />
        <circle cx="38" cy="46" r="3.5" fill="#09090b" />
        <circle cx="62" cy="46" r="3.5" fill="#09090b" />
      </svg>
    );

    const etiquetaAnimal = (c) => c.arete ? `Arete #${c.arete}` : (c.etiqueta_visual || "S/I");

    function App() {
      const [dbReady, setDbReady] = useState(!!window.AlabastroDB);
      const [data, setData] = useState(null);
      const [syncInfo, setSyncInfo] = useState({ fromCache: true, pending: false, error: null });
      const [tab, setTab] = useState("hoy");
      const [modoSol, setModoSol] = useState(false);

      const [configDesbloqueada, setConfigDesbloqueada] = useState(false);
      const [claveInput, setClaveInput] = useState("");
      const [errorClave, setErrorClave] = useState("");
      const [confirmarLimpieza, setConfirmarLimpieza] = useState(false);
      const [mensajeSistema, setMensajeSistema] = useState("");

      const [modalMadre, setModalMadre] = useState(null);
      const [fechaEventoMadre, setFechaEventoMadre] = useState(hoyISO());
      const [modalCorral, setModalCorral] = useState(null);
      const [modalEnfermedad, setModalEnfermedad] = useState(false);
      const [modalNuevoLote, setModalNuevoLote] = useState(false);
      const [busquedaArete, setBusquedaArete] = useState("");

      useEffect(() => {
        if (window.AlabastroDB) {
          setDbReady(true);
          return;
        }
        const handler = () => setDbReady(true);
        window.addEventListener("alabastro-db-ready", handler);
        return () => window.removeEventListener("alabastro-db-ready", handler);
      }, []);

      useEffect(() => {
        if (!dbReady) return;
        const unsub = window.AlabastroDB.subscribe(
          async (remoteData, fromCache, pending) => {
            setSyncInfo({ fromCache, pending, error: null });
            if (!remoteData) {
              const inicial = generarArranqueReal();
              setData(inicial);
              try { await window.AlabastroDB.save(inicial); } catch (e) {}
            } else {
              setData(remoteData);
            }
          },
          (err) => {
            setSyncInfo((prev) => ({ ...prev, error: err.message }));
            if (!data) setData(generarArranqueReal());
          }
        );
        return () => unsub && unsub();
      }, [dbReady]);

      const abrirModalMadre = (m) => {
        setModalMadre(m);
        setFechaEventoMadre(m.fecha_servicio || m.fecha_celo || hoyISO());
      };

      const mostrarAviso = (txt) => {
        setMensajeSistema(txt);
        setTimeout(() => setMensajeSistema(""), 4000);
      };

      const guardarEstado = async (nuevoEstado, logTexto) => {
        const actualizado = {
          ...nuevoEstado,
          auditoria: [
            { fecha: new Date().toLocaleString("es-VE"), detalle: logTexto },
            ...(nuevoEstado.auditoria || []).slice(0, 79)
          ]
        };
        setData(actualizado);
        if (window.AlabastroDB) {
          try {
            await window.AlabastroDB.save(actualizado);
          } catch (e) {
            console.error("Guardado en cola offline:", e);
          }
        }
      };

      // --- MOTOR DE TAREAS Y ALERTAS CON AVISO DESDE LA VÍSPERA ---
      const tareasCalculadas = useMemo(() => {
        if (!data) return [];
        const hoy = hoyISO();
        const cfg = data.config || CONFIG_DEFAULT;
        const lista = [];

        const agregarTarea = (t) => {
          const diasFaltan = diffDias(hoy, t.fecha);
          let semaforo = "verde";
          let etiqueta = `Faltan ${diasFaltan}d`;
          if (t.forzarRojo || diasFaltan < 0) {
            semaforo = "rojo";
            etiqueta = t.forzarRojo ? "URGENTE · ESTA SEMANA" : `VENCIDO (${Math.abs(diasFaltan)}d)`;
          } else if (diasFaltan === 0) {
            semaforo = "amarillo";
            etiqueta = "HOY";
          } else if (diasFaltan <= cfg.dias_aviso_previo) {
            semaforo = "amarillo";
            etiqueta = "AVISO PREVIO (MAÑANA)";
          }
          lista.push({ ...t, diasFaltan, semaforo, etiqueta });
        };

        // 1. Tareas de Madres
        (data.madres || []).forEach((m) => {
          if (m.estado === "descartada") return;
          const etiquetaMadre = m.nombre_corto || m.id;
          if (m.estado === "gestante" && m.fecha_servicio) {
            if (m.verificacion_21d === "pendiente") {
              agregarTarea({
                id: `verif21-${m.id}`, tipo: "madre_verif21", madreId: m.id, ubicacion: m.jaula,
                titulo: `Verificar celo 21d · ${etiquetaMadre}`,
                detalle: `Jaula ${m.jaula} · Confirmar si no repitió celo tras servicio del ${fmtFecha(m.fecha_servicio)}.`,
                fecha: sumarDias(m.fecha_servicio, cfg.ciclo_celo)
              });
            }
            if (!m.desp_100_hecha) {
              agregarTarea({
                id: `desp100-${m.id}`, tipo: "madre_desp100", madreId: m.id, ubicacion: m.jaula,
                titulo: `Desparasitación + Lavado (Día 100) · ${etiquetaMadre} (Pendiente)`,
                detalle: `Jaula ${m.jaula} · Servicio ${fmtFecha(m.fecha_servicio)}. Aún no desparasitada; programada para el día 100 de gestación.`,
                fecha: sumarDias(m.fecha_servicio, cfg.desp_gestacion)
              });
            }
            if (m.jaula && m.jaula.startsWith("G-")) {
              agregarTarea({
                id: `mat-${m.id}`, tipo: "madre_maternidad", madreId: m.id, ubicacion: m.jaula,
                titulo: `Traslado a Maternidad (Día 107) · ${etiquetaMadre}`,
                detalle: `Desde ${m.jaula} hacia jaula libre M-1 o M-2 (servicio ${fmtFecha(m.fecha_servicio)}).`,
                fecha: sumarDias(m.fecha_servicio, cfg.pase_maternidad)
              });
            }
            agregarTarea({
              id: `parto-${m.id}`, tipo: "madre_parto", madreId: m.id, ubicacion: m.jaula,
              titulo: `Parto probable (Día 114) · ${etiquetaMadre}`,
              detalle: `Servicio ${fmtFecha(m.fecha_servicio)} · Jaula ${m.jaula}. Al parir: Meloxicam 2% + Modificador a las 12h.`,
              fecha: sumarDias(m.fecha_servicio, cfg.parto_probable)
            });
          }

          if (m.estado === "lactante" && m.fecha_parto) {
            if (!m.descolmillado_hecho) {
              agregarTarea({
                id: `desc-${m.id}`, tipo: "camada_descolmillado", madreId: m.id, ubicacion: m.jaula,
                titulo: `Día 2: Descolmillado camada · ${etiquetaMadre}`,
                detalle: `Jaula ${m.jaula} · ${m.nacidos_vivos} lechones nacidos vivos.`,
                fecha: sumarDias(m.fecha_parto, cfg.dia_descolmillado)
              });
            }
            if (!m.cola_hierro1_hecho) {
              agregarTarea({
                id: `hierro1-${m.id}`, tipo: "camada_hierro1", madreId: m.id, ubicacion: m.jaula,
                titulo: `Día 3: Corte de cola + 1er Hierro + Aretes (#${data.siguiente_cerdo_id || 1} en adelante) · ${etiquetaMadre}`,
                detalle: `Jaula ${m.jaula} · Asignar aretes correlativos a los nacidos en granja y aplicar hierro.`,
                fecha: sumarDias(m.fecha_parto, cfg.dia_cola_hierro1)
              });
            }
            if (!m.castracion_hecho) {
              agregarTarea({
                id: `cast-${m.id}`, tipo: "camada_castracion", madreId: m.id, ubicacion: m.jaula,
                titulo: `Día 7: Castración de machos · ${etiquetaMadre}`,
                detalle: `Jaula ${m.jaula} · Revisar lechones machos de la camada.`,
                fecha: sumarDias(m.fecha_parto, cfg.dia_castracion)
              });
            }
            if (!m.hierro2_hecho) {
              agregarTarea({
                id: `hierro2-${m.id}`, tipo: "camada_hierro2", madreId: m.id, ubicacion: m.jaula,
                titulo: `Día 12: 2da Dosis de Hierro · ${etiquetaMadre}`,
                detalle: `Jaula ${m.jaula} · Refuerzo de hierro antes del destete.`,
                fecha: sumarDias(m.fecha_parto, cfg.dia_hierro2)
              });
            }
            const diasDest = m.tipo_destete === "corto" ? cfg.destete_corto : cfg.destete_largo;
            agregarTarea({
              id: `dest-${m.id}`, tipo: "madre_destete", madreId: m.id, ubicacion: m.jaula,
              titulo: `Destete (${diasDest}d) + Vitamina B12 / Desparasitación · ${etiquetaMadre}`,
              detalle: `Jaula ${m.jaula} · Madre: Vit B12 + Modificador + Desparasitante y pase a gestación (dejar 1er celo libre). Lechones: Vit B.`,
              fecha: sumarDias(m.fecha_parto, diasDest)
            });
          }

          if (m.estado === "celo_libre_espera" && m.fecha_destete) {
            agregarTarea({
              id: `celo2-${m.id}`, tipo: "madre_servicio_2celo", madreId: m.id, ubicacion: m.jaula,
              titulo: `2do Celo Post-Destete (Listo para Monta/IA) · ${etiquetaMadre}`,
              detalle: `Jaula ${m.jaula} · 1er celo libre pasado; verificar con verraco celador V-001.`,
              fecha: sumarDias(m.fecha_destete, 23)
            });
          }
        });

        // 2. Cerdos marcados para sacrificio esta semana (S/I)
        const paraSacrificio = (data.cerdos || []).filter((c) => c.estado === "engorde" && c.prioridad_sacrificio_semana);
        if (paraSacrificio.length > 0) {
          const machos = paraSacrificio.filter((x) => x.sexo === "M").length;
          const hembras = paraSacrificio.filter((x) => x.sexo === "H").length;
          agregarTarea({
            id: "sacrificio-semana-e1",
            tipo: "sacrificio_semana",
            corral: "E-1",
            ubicacion: "E-1",
            forzarRojo: true,
            titulo: `Sacrificio esta semana · ${paraSacrificio.length} cerdos (${machos} machos, ${hembras} hembra · S/I)`,
            detalle: `Corral E-1 (camada 25-05-2026, sin arete / S/I). Registrar peso vivo, canal y rendimiento.`,
            fecha: hoy
          });
        }

        // 3. Tareas agrupadas por Corral para Cerdos nacidos en granja (con arete)
        const conAreteActivos = (data.cerdos || []).filter((c) => c.arete && (c.estado === "pre-ceba" || c.estado === "engorde") && !c.prioridad_sacrificio_semana);
        const porCorral = {};
        conAreteActivos.forEach((c) => {
          if (!porCorral[c.corral]) porCorral[c.corral] = [];
          porCorral[c.corral].push(c);
        });

        Object.entries(porCorral).forEach(([corral, grupo]) => {
          const ids = grupo.map((x) => Number(x.arete)).sort((a, b) => a - b);
          const rangoTxt = ids.length > 1 ? `Aretes ${ids[0]} al ${ids[ids.length - 1]} (${ids.length} cerdos)` : `Arete ${ids[0]}`;
          const ref = grupo[0];

          if (!ref.desp1_hecha && ref.fecha_destete) {
            agregarTarea({
              id: `desp1-${corral}`, tipo: "lote_desp1", corral, ubicacion: corral,
              titulo: `1ra Desparasitación Oral + Modificador Orgánico · ${corral}`,
              detalle: `${rangoTxt} · Al día siguiente preparar vacunación.`,
              fecha: sumarDias(ref.fecha_destete, cfg.desp1_post_destete)
            });
          } else if (ref.desp1_hecha && !ref.vacuna1_prep_hecha && ref.fecha_desp1_real) {
            agregarTarea({
              id: `vac1-${corral}`, tipo: "lote_vacuna1", corral, ubicacion: corral,
              titulo: `Preparar Vacunación (Día siguiente a 1ra Desp.) · ${corral}`,
              detalle: `${rangoTxt} · Validar biológico con veterinario.`,
              fecha: sumarDias(ref.fecha_desp1_real, 1)
            });
          }

          if (!ref.desp2_hecha && ref.fecha_nacimiento) {
            agregarTarea({
              id: `desp2-${corral}`, tipo: "lote_desp2", corral, ubicacion: corral,
              titulo: `2da Desparasitación (Día 60-63) + Modificador Orgánico · ${corral}`,
              detalle: `${rangoTxt} · 30 días después de la primera; día siguiente preparar vacuna.`,
              fecha: sumarDias(ref.fecha_nacimiento, cfg.desp2_vida)
            });
          }

          if (!ref.vitb80_hecha && ref.fecha_nacimiento) {
            agregarTarea({
              id: `vitb80-${corral}`, tipo: "lote_vitb80", corral, ubicacion: corral,
              titulo: `Vitamina B (Día 80 de vida) · ${corral}`,
              detalle: `${rangoTxt} · Refuerzo metabólico previo a fase final.`,
              fecha: sumarDias(ref.fecha_nacimiento, cfg.vitb_ceba_dia)
            });
          }

          if (!ref.desp3_hecha && ref.fecha_nacimiento) {
            agregarTarea({
              id: `desp3-${corral}`, tipo: "lote_desp3", corral, ubicacion: corral,
              titulo: `3ra Desparasitación (Día 105) + Modificador Orgánico · ${corral}`,
              detalle: `${rangoTxt} · Respetar periodo de retiro antes de sacrificio.`,
              fecha: sumarDias(ref.fecha_nacimiento, cfg.desp3_vida)
            });
          }

          if (ref.fecha_nacimiento) {
            const fecha5m = sumarDias(ref.fecha_nacimiento, cfg.dias_sacrificio_ceba);
            if (diffDias(hoy, fecha5m) <= 7) {
              agregarTarea({
                id: `sac5m-${corral}`, tipo: "lote_sacrificio_5m", corral, ubicacion: corral,
                titulo: `Meta 5 Meses (150 días) · Listos para Sacrificio · ${corral}`,
                detalle: `${rangoTxt} · Verificar peso objetivo (${cfg.peso_objetivo_kg} kg) y ausencia de retiro sanitario.`,
                fecha: fecha5m
              });
            }
          }
        });

        return lista.sort((a, b) => a.diasFaltan - b.diasFaltan);
      }, [data]);

      // --- EJECUTAR TAREA CON UN TOQUE ("HECHO") ---
      const completarTarea = (t) => {
        const hoy = hoyISO();
        const nuevo = JSON.parse(JSON.stringify(data));

        if (t.tipo === "sacrificio_semana") {
          setTab("cerdos");
          mostrarAviso("Ve a los cerdos marcados en rojo en E-1 para registrar su sacrificio o retiro.");
          return;
        }

        if (t.madreId) {
          const m = nuevo.madres.find((x) => x.id === t.madreId);
          if (!m) return;
          if (t.tipo === "madre_verif21") m.verificacion_21d = "confirmada";
          if (t.tipo === "madre_desp100") m.desp_100_hecha = true;
          if (t.tipo === "madre_maternidad") {
            const libre = nuevo.jaulas.find((j) => j.area === "Maternidad" && j.estado === "activa" && !nuevo.madres.some((md) => md.jaula === j.id && md.estado !== "descartada"));
            if (!libre) {
              mostrarAviso("No hay jaulas libres en Maternidad (M-1 o M-2). Libera una primero.");
              return;
            }
            m.jaula = libre.id;
          }
          if (t.tipo === "madre_parto") {
            const fechaPartoInput = prompt(`Parto de ${m.nombre_corto || m.id} · Fecha real del parto (AAAA-MM-DD):`, t.fecha || hoy);
            if (!fechaPartoInput) return;
            const vivos = Number(prompt(`¿Cuántos lechones nacieron VIVOS?`, "11") || 0);
            const muertos = Number(prompt(`¿Cuántos nacieron MUERTOS?`, "0") || 0);
            const tipoDest = confirm("¿Será destete LARGO de 30 días? (Aceptar = 30 días / Cancelar = Corto 21 días)") ? "largo" : "corto";
            m.estado = "lactante";
            m.fecha_parto = fechaPartoInput;
            m.nacidos_vivos = vivos;
            m.nacidos_muertos = muertos;
            m.tipo_destete = tipoDest;
            m.partos = (m.partos || 0) + 1;
            m.nacidos_vivos_total = (m.nacidos_vivos_total || 0) + vivos;
            m.descolmillado_hecho = false;
            m.cola_hierro1_hecho = false;
            m.castracion_hecho = false;
            m.hierro2_hecho = false;
          }
          if (t.tipo === "camada_descolmillado") m.descolmillado_hecho = true;
          if (t.tipo === "camada_hierro1") {
            m.cola_hierro1_hecho = true;
            const cant = m.nacidos_vivos || 0;
            let seq = nuevo.siguiente_cerdo_id || 1;
            for (let k = 0; k < cant; k++) {
              nuevo.cerdos.push({
                id: `NAC-${seq}`,
                arete: String(seq),
                etiqueta_visual: `Arete #${seq}`,
                madre_id: m.nombre_corto || m.id,
                sexo: k % 2 === 0 ? "M" : "H",
                fecha_nacimiento: m.fecha_parto || hoy,
                fecha_destete: "",
                corral: m.jaula,
                estado: "lactante",
                peso_kg: 1.8,
                en_retiro_hasta: ""
              });
              seq++;
            }
            nuevo.siguiente_cerdo_id = seq;
          }
          if (t.tipo === "camada_castracion") m.castracion_hecho = true;
          if (t.tipo === "camada_hierro2") m.hierro2_hecho = true;
          if (t.tipo === "madre_destete") {
            const fechaDestInput = prompt(`Destete de ${m.nombre_corto || m.id} · Fecha real del destete (AAAA-MM-DD):`, t.fecha || hoy);
            if (!fechaDestInput) return;
            const corralPre = nuevo.jaulas.find((j) => j.area === "Pre-ceba" && j.estado === "activa")?.id || "PC-1";
            const jaulaGest = nuevo.jaulas.find((j) => j.area === "Gestación" && j.estado === "activa" && !nuevo.madres.some((md) => md.jaula === j.id && md.estado !== "descartada"))?.id || "G-1";
            nuevo.cerdos.forEach((c) => {
              if (c.madre_id === (m.nombre_corto || m.id) && c.estado === "lactante") {
                c.estado = "pre-ceba";
                c.corral = corralPre;
                c.fecha_destete = fechaDestInput;
              }
            });
            m.estado = "celo_libre_espera";
            m.fecha_destete = fechaDestInput;
            m.jaula = jaulaGest;
          }
          if (t.tipo === "madre_servicio_2celo") {
            const fechaServInput = prompt(`2do Celo de ${m.nombre_corto || m.id} · Fecha de monta/IA (AAAA-MM-DD):`, t.fecha || hoy);
            if (!fechaServInput) return;
            const tipoServ = confirm("2do Celo Post-Destete: ¿Inseminación Artificial? (Aceptar = IA / Cancelar = Monta Natural)") ? "Inseminación Artificial" : "Monta Natural";
            m.estado = "gestante";
            m.fecha_celo = fechaServInput;
            m.fecha_servicio = fechaServInput;
            m.tipo_servicio = tipoServ;
            m.verificacion_21d = "pendiente";
            m.desp_100_hecha = false;
            if (tipoServ === "Monta Natural" && nuevo.verraco) {
              nuevo.verraco.servicios_realizados = (nuevo.verraco.servicios_realizados || 0) + 1;
            }
          }
        }

        if (t.corral) {
          nuevo.cerdos.forEach((c) => {
            if (c.corral === t.corral && (c.estado === "pre-ceba" || c.estado === "engorde")) {
              if (t.tipo === "lote_desp1") { c.desp1_hecha = true; c.fecha_desp1_real = hoy; }
              if (t.tipo === "lote_vacuna1") { c.vacuna1_prep_hecha = true; }
              if (t.tipo === "lote_desp2") { c.desp2_hecha = true; }
              if (t.tipo === "lote_vitb80") { c.vitb80_hecha = true; }
              if (t.tipo === "lote_desp3") { c.desp3_hecha = true; c.en_retiro_hasta = sumarDias(hoy, 14); }
              if (t.tipo === "lote_sacrificio_5m") setTab("cerdos");
            }
          });
        }

        guardarEstado(nuevo, `Tarea completada: ${t.titulo}`);
        mostrarAviso("✓ Tarea registrada y sincronizada.");
      };

      // --- REGISTRAR NUEVO CELO / SERVICIO EN MADRE CON FECHA MANUAL ---
      const registrarEventoMadre = (madreId, accion) => {
        const fechaSel = fechaEventoMadre || hoyISO();
        const nuevo = JSON.parse(JSON.stringify(data));
        const m = nuevo.madres.find((x) => x.id === madreId);
        if (!m) return;
        const etiquetaMadre = m.nombre_corto || m.id;

        if (accion === "celo_pasado") {
          m.estado = "vacia";
          m.fecha_celo = fechaSel;
          m.proximo_celo_esperado = sumarDias(fechaSel, nuevo.config.ciclo_celo);
          guardarEstado(nuevo, `${etiquetaMadre}: Celo registrado el ${fmtFecha(fechaSel)} (próximo en 21d: ${fmtFecha(m.proximo_celo_esperado)}).`);
        } else if (accion === "monta" || accion === "ia") {
          m.estado = "gestante";
          m.fecha_celo = fechaSel;
          m.fecha_servicio = fechaSel;
          m.tipo_servicio = accion === "ia" ? "Inseminación Artificial" : "Monta Natural";
          m.verificacion_21d = "pendiente";
          m.desp_100_hecha = false;
          if (accion === "monta" && nuevo.verraco) {
            nuevo.verraco.servicios_realizados = (nuevo.verraco.servicios_realizados || 0) + 1;
          }
          guardarEstado(nuevo, `${etiquetaMadre}: ${m.tipo_servicio} registrada el ${fmtFecha(fechaSel)} (parto probable: ${fmtFecha(sumarDias(fechaSel, nuevo.config.parto_probable))}).`);
        } else if (accion === "repite_celo") {
          m.estado = "vacia";
          m.repeticiones = (m.repeticiones || 0) + 1;
          m.fecha_celo = fechaSel;
          m.fecha_servicio = "";
          guardarEstado(nuevo, `${etiquetaMadre}: Repitió celo el ${fmtFecha(fechaSel)}; ciclo reiniciado.`);
        } else if (accion === "meloxicam_parto") {
          m.meloxicam_parto_hecho = true;
          guardarEstado(nuevo, `${etiquetaMadre}: Meloxicam 2% + Modificador orgánico aplicados el ${fmtFecha(fechaSel)}.`);
        } else if (accion === "descartar") {
          const motivo = prompt(`Motivo de descarte para ${etiquetaMadre} (Reproductivo / Sanitario / Edad):`, "Reproductivo");
          if (!motivo) return;
          m.estado = "descartada";
          m.jaula = "";
          nuevo.bajas_sacrificios.push({
            fecha: fechaSel, tipo: "Descarte Madre", id_animal: m.id, arete: m.arete, etiqueta_visual: etiquetaMadre, motivo
          });
          guardarEstado(nuevo, `${etiquetaMadre} descartada el ${fmtFecha(fechaSel)} (${motivo}) y jaula liberada.`);
        }
        setModalMadre(null);
        mostrarAviso(`✓ Ciclo actualizado para ${etiquetaMadre} (${fmtFecha(fechaSel)}).`);
      };

      const crearLoteManual = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const cantidad = Math.max(1, Number(fd.get("cantidad") || 1));
        const corral = fd.get("corral");
        const fechaNac = fd.get("fecha_nac") || hoyISO();
        const peso = Number(fd.get("peso") || 15);
        const sexoLote = fd.get("sexo") || "M";
        const destino = fd.get("destino") || "engorde";
        const tieneArete = fd.get("tiene_arete") === "si";

        const nuevo = JSON.parse(JSON.stringify(data));
        let seq = nuevo.siguiente_cerdo_id || 1;
        const inicioArete = seq;
        for (let i = 0; i < cantidad; i++) {
          const sx = sexoLote === "MIXTO" ? (i % 2 === 0 ? "M" : "H") : sexoLote;
          nuevo.cerdos.push({
            id: tieneArete ? `NAC-${seq}` : `SI-${Date.now()}-${i}`,
            arete: tieneArete ? String(seq) : "",
            etiqueta_visual: tieneArete ? `Arete #${seq}` : `${sx === "M" ? "Macho" : "Hembra"} · S/I`,
            madre_id: "Madre 1",
            sexo: sx,
            fecha_nacimiento: fechaNac,
            fecha_destete: sumarDias(fechaNac, 30),
            corral,
            estado: destino,
            peso_kg: peso,
            en_retiro_hasta: "",
            desp1_hecha: false,
            desp2_hecha: false,
            vitb80_hecha: false,
            desp3_hecha: false
          });
          if (tieneArete) seq++;
        }
        if (tieneArete) {
          nuevo.siguiente_cerdo_id = seq;
          guardarEstado(nuevo, `Ingresados ${cantidad} cerdos con arete en ${corral} (#${inicioArete} al #${seq - 1}).`);
        } else {
          guardarEstado(nuevo, `Ingresados ${cantidad} cerdos (S/I) en ${corral}.`);
        }
        setModalNuevoLote(false);
        mostrarAviso(`✓ ${cantidad} cerdos registrados en ${corral}.`);
      };

      const actualizarPesoCorral = (corralId) => {
        const pesoStr = prompt(`Nuevo peso promedio en kg para los cerdos activos de ${corralId}:`, "105");
        if (!pesoStr || isNaN(Number(pesoStr))) return;
        const nuevo = JSON.parse(JSON.stringify(data));
        nuevo.cerdos.forEach((c) => {
          if (c.corral === corralId && (c.estado === "pre-ceba" || c.estado === "engorde")) {
            c.peso_kg = Number(pesoStr);
          }
        });
        guardarEstado(nuevo, `Pesaje actualizado en ${corralId}: ${pesoStr} kg promedio.`);
        mostrarAviso(`✓ Peso actualizado en ${corralId}.`);
      };

      const moverLoteCorral = (corralOrigen) => {
        const destino = prompt(`Mover cerdos activos de ${corralOrigen} hacia qué corral (ej. E-1, E-2, E-3, E-4):`, "E-2");
        if (!destino) return;
        const jaulaDest = data.jaulas.find((j) => j.id.toUpperCase() === destino.trim().toUpperCase());
        if (!jaulaDest) {
          mostrarAviso("El corral destino no existe.");
          return;
        }
        const nuevo = JSON.parse(JSON.stringify(data));
        nuevo.cerdos.forEach((c) => {
          if (c.corral === corralOrigen && (c.estado === "pre-ceba" || c.estado === "engorde")) {
            c.corral = jaulaDest.id;
            if (jaulaDest.area === "Engorde") c.estado = "engorde";
          }
        });
        guardarEstado(nuevo, `Lote trasladado de ${corralOrigen} a ${jaulaDest.id}.`);
        mostrarAviso(`✓ Lote movido a ${jaulaDest.id}.`);
      };

      const retirarOSacrificarCerdo = (cerdo, modo) => {
        const hoy = hoyISO();
        const descAnimal = etiquetaAnimal(cerdo);
        if (modo === "sacrificio") {
          if (cerdo.en_retiro_hasta && hoy <= cerdo.en_retiro_hasta) {
            mostrarAviso(`BLOQUEO SANITARIO: ${descAnimal} en retiro hasta ${fmtFecha(cerdo.en_retiro_hasta)}.`);
            return;
          }
          const pesoVivo = Number(prompt(`Sacrificio ${descAnimal} (${cerdo.sexo}) · Peso vivo final (kg):`, String(cerdo.peso_kg || 105)));
          if (!pesoVivo) return;
          const pesoCanal = Number(prompt(`Peso en canal obtenido (kg) para ${descAnimal}:`, String((pesoVivo * 0.78).toFixed(1))));
          if (!pesoCanal) return;
          const rend = ((pesoCanal / pesoVivo) * 100).toFixed(1);
          const nuevo = JSON.parse(JSON.stringify(data));
          const target = nuevo.cerdos.find((x) => x.id === cerdo.id);
          target.estado = "sacrificado";
          target.prioridad_sacrificio_semana = false;
          target.corral = "";
          nuevo.bajas_sacrificios.unshift({
            fecha: hoy, tipo: "Sacrificio", id_animal: cerdo.id, arete: cerdo.arete || "", etiqueta_visual: descAnimal,
            peso_vivo: pesoVivo, peso_canal: pesoCanal, rendimiento: `${rend}%`
          });
          guardarEstado(nuevo, `Sacrificio ${descAnimal}: ${pesoVivo} kg vivo / ${pesoCanal} kg canal (${rend}%).`);
          mostrarAviso(`✓ Sacrificio registrado (${descAnimal} · ${rend}%).`);
        } else {
          const causa = prompt(`RETIRO / BAJA antes de sacrificio para ${descAnimal} (Muerte / Descarte sanitario / Venta en pie):`, "Muerte");
          if (!causa) return;
          const pesoBaja = Number(prompt(`Peso estimado al momento del retiro (kg):`, String(cerdo.peso_kg || 0)));
          const nuevo = JSON.parse(JSON.stringify(data));
          const target = nuevo.cerdos.find((x) => x.id === cerdo.id);
          target.estado = "retirado_baja";
          target.prioridad_sacrificio_semana = false;
          target.corral = "";
          nuevo.bajas_sacrificios.unshift({
            fecha: hoy, tipo: "Retiro antes de sacrificio", id_animal: cerdo.id, arete: cerdo.arete || "", etiqueta_visual: descAnimal,
            motivo: causa, peso_vivo: pesoBaja
          });
          guardarEstado(nuevo, `Retiro en corral ${descAnimal} (${causa}, ${pesoBaja} kg). Cupo liberado.`);
          mostrarAviso(`✓ Retiro registrado para ${descAnimal}.`);
        }
      };

      const registrarEnfermedad = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const ident = fd.get("arete").trim();
        const signos = fd.get("signos").trim();
        const trat = fd.get("tratamiento").trim();
        const diasRetiro = Number(fd.get("retiro") || 0);
        const hoy = hoyISO();
        const nuevo = JSON.parse(JSON.stringify(data));
        const cerdo = nuevo.cerdos.find((c) => (c.arete && c.arete === ident) || (c.etiqueta_visual && c.etiqueta_visual.toLowerCase().includes(ident.toLowerCase())));
        if (cerdo && diasRetiro > 0) {
          cerdo.en_retiro_hasta = sumarDias(hoy, diasRetiro);
        }
        nuevo.casos_enfermedad.unshift({
          id: Date.now(), fecha: hoy, arete: cerdo ? etiquetaAnimal(cerdo) : ident, corral: cerdo ? cerdo.corral : "Maternidad/Gest.",
          signos, tratamiento: trat, dias_retiro: diasRetiro, fin_retiro: diasRetiro > 0 ? sumarDias(hoy, diasRetiro) : ""
        });
        guardarEstado(nuevo, `Caso clínico registrado para ${ident} (Retiro: ${diasRetiro} días).`);
        setModalEnfermedad(false);
        mostrarAviso(`✓ Caso clínico registrado para ${ident}.`);
      };

      if (!data) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-zinc-950 text-white p-6">
            <LogoAlabastro className="w-20 h-20 mb-4" />
            <p className="text-lg font-bold">Conectando con Granja Alabastro...</p>
          </div>
        );
      }

      const bgApp = modoSol ? "bg-white text-black" : "bg-zinc-100 text-zinc-900";
      const cardBase = modoSol ? "bg-white border-2 border-black shadow-none" : "bg-white border border-zinc-200 shadow-sm";

      const tareasRojas = tareasCalculadas.filter((t) => t.semaforo === "rojo");
      const tareasAmarillas = tareasCalculadas.filter((t) => t.semaforo === "amarillo");
      const tareasVerdes = tareasCalculadas.filter((t) => t.semaforo === "verde");

      return (
        <div className={`min-h-screen pb-24 ${bgApp}`}>
          {mensajeSistema && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-zinc-950 text-white px-5 py-3 rounded-2xl shadow-xl font-black text-xs border border-zinc-700">
              {mensajeSistema}
            </div>
          )}

          {/* CABECERA OPERATIVA */}
          <header className="bg-zinc-950 text-white sticky top-0 z-30 border-b border-zinc-800">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <LogoAlabastro className="w-11 h-11 shrink-0" />
                <div>
                  <h1 className="font-black text-lg leading-tight tracking-tight">GRANJA ALABASTRO</h1>
                  <div className="flex items-center gap-2 text-xs text-zinc-300">
                    <span>{fmtFecha(hoyISO())}</span>
                    <span>·</span>
                    <span className={`inline-flex items-center gap-1 font-semibold ${syncInfo.error ? "text-amber-400" : "text-emerald-400"}`}>
                      <span className={`w-2 h-2 rounded-full ${syncInfo.error ? "bg-amber-400" : "bg-emerald-400"}`}></span>
                      {syncInfo.error ? "Modo Offline" : "Nube Sincronizada"}
                    </span>
                  </div>
                </div>
              </div>
              <button
                onClick={() => setModoSol(!modoSol)}
