                  <input name="fecha_nac" type="date" defaultValue={hoyISO()} required className="w-full mt-1 p-3 rounded-xl border font-bold text-sm" />
                </label>
                <label className="block text-xs font-bold">
                  Peso promedio actual (kg)
                  <input name="peso" type="number" step="0.1" defaultValue="105" required className="w-full mt-1 p-3 rounded-xl border font-bold text-sm" />
                </label>
                <button type="submit" className="btn-touch w-full rounded-xl bg-zinc-950 text-white font-black text-sm">
                  Guardar Lote y Sincronizar
                </button>
              </form>
            </div>
          )}

          {/* MODAL DETALLE DE CORRAL / JAULA */}
          {modalCorral && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl p-5 space-y-3">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-black text-lg">{modalCorral.area} · {modalCorral.id}</h3>
                  <button onClick={() => setModalCorral(null)} className="text-sm font-black px-2 py-1">✕</button>
                </div>
                <p className="text-xs text-zinc-600 font-bold">Capacidad máxima: {modalCorral.capacidad} · Estado: {modalCorral.estado}</p>
                <div className="space-y-2">
                  {tareasCalculadas.filter((t) => t.ubicacion === modalCorral.id).map((t) => (
                    <div key={t.id} className="p-3 rounded-xl bg-zinc-100 text-xs flex justify-between items-center gap-2">
                      <div>
                        <div className="font-black">{t.titulo}</div>
                        <div className="text-zinc-500">{fmtFecha(t.fecha)}</div>
                      </div>
                      <button onClick={() => { completarTarea(t); setModalCorral(null); }} className="px-3 py-2 rounded-lg bg-zinc-950 text-white font-black">
                        {t.tipo === "sacrificio_semana" ? "Ver" : "Hecho"}
                      </button>
                    </div>
                  ))}
                  {tareasCalculadas.filter((t) => t.ubicacion === modalCorral.id).length === 0 && (
                    <p className="text-xs text-zinc-500">Sin alertas pendientes en esta unidad.</p>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL REPORTAR ENFERMEDAD / RETIRO */}
          {modalEnfermedad && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <form onSubmit={registrarEnfermedad} className="bg-white w-full max-w-md rounded-2xl p-5 space-y-3">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-black text-base">Registrar Enfermedad / Periodo de Retiro</h3>
                  <button type="button" onClick={() => setModalEnfermedad(false)} className="font-black">✕</button>
                </div>
                <input name="arete" required placeholder="Arete o S/I (ej. Macho · S/I o #1)" className="w-full p-3 rounded-xl border font-bold text-sm" />
                <input name="signos" required placeholder="Signos clínicos (ej. Fiebre, decaimiento)" className="w-full p-3 rounded-xl border font-bold text-sm" />
                <input name="tratamiento" required placeholder="Tratamiento aplicado" className="w-full p-3 rounded-xl border font-bold text-sm" />
                <input name="retiro" type="number" min="0" defaultValue="7" required placeholder="Días de retiro antes de sacrificio" className="w-full p-3 rounded-xl border font-bold text-sm" />
                <button type="submit" className="btn-touch w-full rounded-xl bg-red-600 text-white font-black text-sm">
                  Guardar y Activar Bloqueo de Retiro
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
